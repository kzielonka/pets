AllCops:
  NewCops: enable
  Exclude:
    - '**/db/**/*'
    - '**/bin/**/*'
    - '**/tmp/**/*'
    - '**/vendor/**/*'
    - 'postgres-data/**/*'
    - '**/db/schema.rb'

Style/Documentation:
  Enabled: false

Naming/VariableNumber:
  Enabled: false

Naming/MethodName:
  Enabled: false

Naming/MethodParameterName:
  Enabled: false

Naming/PredicateName:
  Enabled: false

Gemspec/RequiredRubyVersion:
  Enabled: false

Gemspec/DevelopmentDependencies:
  Enabled: false

Layout/LineLength:
  Enabled: false

Lint/DuplicateBranch:
  Enabled: false

Lint/BinaryOperatorWithIdenticalOperands:
  Enabled: false

Metrics/ParameterLists:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false
